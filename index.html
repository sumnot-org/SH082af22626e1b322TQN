<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>404 — sumnot.org</title>
  <link rel="icon" type="image/png" href="mini-2-transparent.png">
  <style>
    :root {
      --ink: #181818;
      --muted: #6b6863;
      --accent: #ff5a1f;
      --left: max(24px, env(safe-area-inset-left));
      --right: max(24px, env(safe-area-inset-right));
      --top: max(22px, env(safe-area-inset-top));
      --bottom: max(22px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .brand {
      position: fixed;
      z-index: 2;
      top: var(--top);
      left: var(--left);
      display: block;
      width: clamp(154px, 14vw, 210px);
    }

    .brand img {
      display: block;
      width: 100%;
      height: auto;
    }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 100px 24px;
      text-align: center;
    }

    .error {
      transform: translateY(-1vh);
    }

    .error-code {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(54px, 7vw, 88px);
      font-weight: 500;
      line-height: .8;
      letter-spacing: -.075em;
    }

    .error-label {
      margin: clamp(14px, 2.2vh, 22px) 0 0;
      color: var(--accent);
      font-size: clamp(15px, 1.35vw, 19px);
      font-weight: 700;
      letter-spacing: .04em;
    }

    .site-link,
    .support-link {
      position: fixed;
      z-index: 2;
      bottom: var(--bottom);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
      text-underline-offset: 4px;
      transition: color .15s ease;
    }

    .site-link {
      left: var(--left);
    }

    .support-link {
      right: var(--right);
      text-align: right;
    }

    .site-link:hover,
    .support-link:hover {
      color: var(--ink);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      :root {
        --left: max(16px, env(safe-area-inset-left));
        --right: max(16px, env(safe-area-inset-right));
        --top: max(17px, env(safe-area-inset-top));
        --bottom: max(17px, env(safe-area-inset-bottom));
      }

      .brand {
        width: 138px;
      }

      main {
        padding: 90px 16px 80px;
      }

      .error {
        transform: none;
      }

      .error-code {
        font-size: clamp(52px, 18vw, 72px);
        line-height: .84;
      }

      .error-label {
        margin-top: 14px;
        font-size: 13px;
      }

      .site-link,
      .support-link {
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      .brand {
        width: 124px;
      }

      .error-code {
        font-size: 50px;
      }

      .site-link,
      .support-link {
        font-size: 9px;
      }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .brand {
        width: 120px;
      }

      .error-code {
        font-size: 58px;
      }

      .error-label {
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>
  <a class="brand" href="https://www.sumnot.org/" aria-label="SUMNOT home">
    <img src="sumnot-wordmark-transparent-v3.png" alt="SUMNOT">
  </a>

  <main>
    <div class="error">
      <p class="error-code">404</p>
      <p class="error-label">Error!</p>
    </div>
  </main>

  <a class="site-link" href="https://www.sumnot.org/">www.sumnot.org</a>
  <a class="support-link" href="mailto:support@sumnot.org">support@sumnot.org</a>
</body>
</html>
